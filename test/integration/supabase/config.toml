# Generated with Supabase CLI 3.0.0, reduced to the services exercised in CI.
# This directory is never linked to a hosted project. No production credentials.
project_id = "route_planner_ci_v3"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = true

[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "2m"

[db.seed]
enabled = false

[realtime]
enabled = false
[studio]
enabled = false
[local_smtp]
enabled = false
[storage]
enabled = false
[analytics]
enabled = false
[edge_runtime]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:4455"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
# Test accounts only: local Auth returns a session without sending real emails.
enable_confirmations = false
