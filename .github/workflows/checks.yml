name: Web checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: web-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://auth.example.test
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev
  authenticated-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: FernandoBalsimelli/Route-Planner-API
          ref: f5c36390dbeffa34d8cc8a01a1c05b9121005a1a
          path: _ci/api
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix _ci/api
      - run: npm ci --prefix test/integration
      - name: Start disposable Supabase Auth and REST
        run: |
          mkdir -p test/integration/supabase/migrations
          cp _ci/api/supabase/migrations/*.sql test/integration/supabase/migrations/
          node test/integration/start-stack.mjs
          node test/integration/prepare-env.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify real local sessions, route lifecycle and account isolation
        run: node --test test/integration/authenticated.e2e.mjs
      - name: Stop disposable stack
        if: always()
        run: test/integration/node_modules/.bin/supabase --workdir test/integration stop
